{% extends "base.html" %}
{% block content %}
<div style="background: #fff; padding: 30px; border-radius: 16px; border-left: 6px solid #3498db; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h1 style="margin: 0; border: none;">📖 {{ subject.name }}</h1>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;">
    {% for les in lessons %}
    <div style="background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0;">
        <h3 style="color: #2c3e50; border-bottom: 2px solid #f1f2f6; padding-bottom: 10px;">{{ les.title }}</h3>
        <p style="color: #555; font-size: 0.95rem;">{{ les.content | safe }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
