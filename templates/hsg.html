{% extends "base.html" %}
{% block content %}
<div style="background: #fff; padding: 30px; border-radius: 16px; border-left: 6px solid #e74c3c; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
    <h1 style="margin: 0; border: none; color: #e74c3c;">🏆 Luyện thi Học sinh giỏi</h1>
</div>
<form method="get" style="margin-bottom: 20px;">
    <select name="id" onchange="this.form.submit()" style="padding: 10px; width: 100%; max-width: 400px; border-radius: 8px; border: 1px solid #ccc;">
        {% for ex in exercises %}
        <option value="{{ loop.index0 }}" {% if loop.index0 == current %}selected{% endif %}>{{ ex.title }}</option>
        {% endfor %}
    </select>
</form>
{% if exercise %}
<div style="background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px;">
    <h3 style="color: #2c3e50;">Đề bài:</h3>
    <p style="font-size: 1.1rem;">{{ exercise.question }}</p>
</div>
<form method="post" style="background: #fff; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0;">
    <textarea name="answer" rows="6" style="width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit;" placeholder="Nhập bài giải...">{{ user_answer }}</textarea>
    <button type="submit" class="btn btn-primary" style="margin-top: 15px; background: #e74c3c; border-color: #e74c3c;">Nộp bài & Xem đáp án</button>
</form>
{% if show_solution %}
<div style="background: #f4fcf7; padding: 25px; border-radius: 12px; border-left: 6px solid #2ecc71; margin-top: 25px;">
    <h3 style="color: #27ae60;">💡 Hướng dẫn giải:</h3>
    <p>{{ exercise.solution | safe }}</p>
</div>
{% endif %}
{% endif %}
{% endblock %}
